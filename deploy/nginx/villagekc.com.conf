# /etc/nginx/sites-available/villagekc.com on the droplet (shared with RetainX and
# app.villagekc.com). Install HTTP-only first; then
#   sudo certbot --nginx -d villagekc.com -d www.villagekc.com
# adds the 443/SSL parts and the HTTP->HTTPS redirect. Copy the live result back here.

# www -> villagekc.com (the canonical address in the sitemap and every page's <link rel=canonical>)
server {
    listen 80;
    listen [::]:80;
    server_name www.villagekc.com;
    return 301 https://villagekc.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name villagekc.com;

    root /var/www/villagekc.com/html;
    index index.html;

    # Old Squarespace addresses that Google still has indexed.
    location = /home  { return 301 /; }
    location = /store { return 301 /; }
    location ^~ /store/ { return 301 /; }

    # Pages are built as /about/index.html but linked as /about (no trailing slash).
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Astro's hashed CSS, JS and images never change once built.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
}
